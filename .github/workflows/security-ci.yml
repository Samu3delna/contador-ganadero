name: Security & Quality Gate

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  security-and-tests:
    name: Audit, Secret Check, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify no committed .env or .p12 files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "❌ Se detectó un archivo .env versionado en Git"
            exit 1
          fi
          if git ls-files | grep -iE '\.(p12|pfx|pem|key)$'; then
            echo "❌ Se detectó una llave privada o certificado .p12 versionado en Git"
            exit 1
          fi

      - name: Run npm audit (high/critical)
        run: npm audit --audit-level=high --omit=dev || true

      - name: Run Backend Automated Tests (Jest + Supertest)
        working-directory: backend
        run: npm test

      - name: Build Frontend Production Bundle (Cloudflare SPA)
        working-directory: frontend
        run: npm run build
